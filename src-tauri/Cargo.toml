[package]
name = "lanceur"
version = "0.1.0"
description = "Lanceur d'apps Windows personnel"
authors = ["acassar"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lanceur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# `raw_value` : lire un morceau de JSON brut sans le convertir (favorites.rs).
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
serde_path_to_error = "0.1"
# Plugins officiels Tauri (étape 4) : raccourci clavier global, et instance
# unique (relancer l'exe réaffiche la fenêtre déjà ouverte).
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Étape 6 (icônes) :
# - `reqwest` : client HTTP *async*, pour télécharger les favicons et les
#   jaquettes Steam. Sous Windows, il utilise le TLS du système (SChannel).
# - `image` : décoder (PNG, ICO, JPEG…), redimensionner et réencoder les images.
#   On n'active que les formats utiles, pour compiler moins de code.
# - `base64` : transformer le PNG en `data:` URL pour l'afficher dans le front.
reqwest = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "bmp", "webp"] }
base64 = "0.22"

# Dépendances compilées uniquement pour Windows : l'API Win32 (ShellExecuteExW
# pour ouvrir les .lnk et les URL steam://). Chaque « feature » active une
# partie de l'API, pour ne compiler que ce qu'on utilise.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  # étape 6 : lire les pixels d'une image Windows (HBITMAP → GetDIBits)
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  # requis par la struct SHELLEXECUTEINFOW (champ hkeyClass) ; sert aussi à
  # l'étape 6 pour lire le dossier de Steam dans le registre
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
