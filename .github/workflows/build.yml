# Compile l'app sur un runner Windows à chaque push / PR.
# - Sur main et les PR : tests + build, installeurs disponibles en « artefact » du run.
# - Sur un tag v* (ex. v0.1.0) : crée en plus une Release GitHub brouillon avec les installeurs.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # nécessaire pour créer la Release sur un tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm test --if-present
      # Le dossier dist/ doit exister avant de compiler le Rust (tauri.conf.json → frontendDist).
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag v* : Release brouillon. Sinon (tagName vide) : build simple, sans Release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Lanceur ${{ github.ref_name }}'
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: lanceur-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
