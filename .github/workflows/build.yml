# Compile l'app sur un runner Windows : push sur main, PR, ou lancement manuel (Run workflow).
# Tests + installeurs disponibles en artefact du run. Jeton en lecture seule.
# Les releases sont dans release.yml.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm test --if-present

      # Construit le front (beforeBuildCommand : vue-tsc + vite) puis l'app et les installeurs.
      # Sans tagName, tauri-action ne crée pas de Release.
      - uses: tauri-apps/tauri-action@v0

      # Les tests Rust ont besoin de dist/, produit à l'étape précédente.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: lanceur-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

